name: 三平台個人建置（fork 專用，不上 PR）

# 手動觸發：Mac（arm64/x64 DMG）＋ Windows（NSIS）＋ Linux（deb/AppImage），
# 未簽章個人建置，上傳為 workflow artifacts。Mac 首次開啟需「右鍵 → 開啟」。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: SayIt-mac-arm64.dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            artifact_name: SayIt-mac-x64.dmg
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            artifact_name: SayIt-windows-x64-setup.exe
            rust_target: ""
          - os: ubuntu-latest
            args: --bundles deb appimage
            artifact_name: SayIt-linux-x64
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build unsigned bundles
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
