name: 自訂版本三平台測試建置（不發布）

# 只能手動觸發：建出 Mac（arm64/x64 DMG）＋ Windows（NSIS）＋ Linux（deb/AppImage），
# 上傳成工作產物，給實機試作用。
# 不建 tag、不建 release、不產更新簽章；版號只在建置時覆寫，不提交進 repo。
# 版號必須是 X.Y.Z-test.N：比目前正式版新（不會被拉回舊版）、比下一個正式版舊
# （正式版發布時照常提示更新）。只在 fork 跑個人建置用，不上 PR。
# Mac 產物未簽章，首次開啟需右鍵 → 開啟。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "測試版號（例：0.14.1-test.1）"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: dmg
            artifact_suffix: mac-arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
            artifact_suffix: mac-x64
          - os: windows-latest
            rust_target: ""
            bundles: nsis
            artifact_suffix: windows-x64-setup
          - os: ubuntu-latest
            rust_target: ""
            bundles: deb appimage
            artifact_suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "::error::版號必須是 X.Y.Z-test.N，收到：$TEST_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Build unsigned bundles
        shell: bash
        env:
          TEST_VERSION: ${{ inputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          # 前端顯示與安裝檔檔名用的版號；只在 runner 內改，不提交
          npm pkg set version="$TEST_VERSION"
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET_ARGS="--target ${{ matrix.rust_target }}"
          else
            TARGET_ARGS=""
          fi
          # BUNDLES 為空白分隔清單（如 deb appimage），在此組出 JSON 陣列，
          # 避免引號穿過 Actions 運算式轉義出錯
          TARGETS_JSON="["
          # shellcheck disable=SC2086
          for b in $BUNDLES; do TARGETS_JSON="$TARGETS_JSON\"$b\","; done
          TARGETS_JSON="${TARGETS_JSON%,}]"
          pnpm tauri build $TARGET_ARGS --config "{\"version\":\"$TEST_VERSION\",\"bundle\":{\"targets\":$TARGETS_JSON,\"createUpdaterArtifacts\":false}}"

      - uses: actions/upload-artifact@v4
        with:
          name: SayIt-${{ inputs.version }}-${{ matrix.artifact_suffix }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
